# =====================================================
# 屋根種別ごとの配置既定値（簡易製図AI）
# =====================================================
# 注意: このファイルを編集することで屋根種別ごとの離隔を
# 更新できます。コード変更は不要です。
#
# 適用ルール:
# - 設置枚数が未指定（= 最大枚数の自動算出）の屋根面にのみ適用される。
#   枚数指定がある面は実設計の再現とみなし、離隔を変更しない。
# - フォームやAI抽出で値が明示されている場合はそちらが優先。
#   標準既定値（行間25 / 列間10 / マージン500）のままの項目のみ
#   ここの値で差し替えられる。
# - 学習センターで学習した離隔ルールも常に優先される。
#
# キー:
#   gap_long_mm  : 行間（縦・段と段の間）mm
#   gap_short_mm : 列間（横・列と列の間）mm
#   margin_mm    : 屋根エッジからの離隔 mm
# =====================================================

roof_type_defaults:
  # 陸屋根: 傾斜架台の影対策でアレイ行間を広くとる
  rikuyane:
    gap_long_mm: 500
    gap_short_mm: 10
    margin_mm: 500
  # 瓦 / スレート / 折板（傾斜屋根）は標準の 行間25 / 列間10 / マージン500 のまま
  # 変更したい場合は以下のように追記:
  # setsuban:
  #   gap_long_mm: 25
  #   gap_short_mm: 10
  #   margin_mm: 500
