# =====================================================
# 屋根種別ごとの配置既定値（簡易製図AI）
# =====================================================
# 注意: このファイルを編集することで屋根種別ごとの離隔を
# 更新できます。コード変更は不要です。
#
# 適用ルール:
# - 設置枚数が未指定（= 最大枚数の自動算出）の屋根面にのみ適用される。
#   枚数指定がある面は実設計の再現とみなし、離隔を変更しない。
# - フォームやAI抽出で値が明示されている場合はそちらが優先。
#   標準既定値（長辺側隙間25 / 短辺側隙間10 / マージン500）のままの
#   項目のみここの値で差し替えられる。
# - 学習センターで学習した離隔ルールも常に優先される。
#
# キー（用語は 2026-07-23 会議で「長辺側隙間／短辺側隙間」に統一。
#       内部キー名は後方互換のため不変）:
#   gap_long_mm  : 長辺側隙間（行間・縦・段と段の間）mm
#   gap_short_mm : 短辺側隙間（列間・横・列と列の間）mm
#   margin_mm    : 屋根エッジからの離隔 mm
# =====================================================

# 【離隔（margin）の扱い 2026-08-13 更新】
# 顧客提供「太陽光配置図 作図ルール」3条により、離隔の既定は
# 「各方向の屋根寸法の10%・上限2m」がコード側（layout_engine）で自動適用される。
# ここ・現調・フォームで margin_mm=500 のままの場合は「未指定」とみなされ
# 10%ルールが使われる。特定の離隔を強制したい場合は 500 以外の値を明示するか、
# 方向別の margin_ns_mm / margin_ew_mm を指定すること。
# なお目標枚数が指定された面で10%ルールでは収まらない場合は、作図ルールの
# 優先順位（現調指定 > 標準離隔）により500mmまで自動で緩和される。

roof_type_defaults:
  # 陸屋根(TUG架台): 段間は正解図面2件（マウントあかね様・鎌倉滑川交番様）の
  # TUG架台詳細に合わせ235mm（2026-08-13 更新。旧値500は影対策の推定値だった）
  rikuyane:
    gap_long_mm: 235
    gap_short_mm: 10
  # 瓦 / スレート / 折板（傾斜屋根）は標準の
  # 長辺側隙間25 / 短辺側隙間10 / マージン500 のまま
  # 変更したい場合は以下のように追記:
  # setsuban:
  #   gap_long_mm: 25
  #   gap_short_mm: 10
  #   margin_mm: 500
