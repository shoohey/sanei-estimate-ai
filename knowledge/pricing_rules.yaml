# =====================================================
# 客出し見積 v2（2026-08-15 顧客ルールブック【見積側】）
# 大分類は「1.共通仮設工事 2.太陽光発電システム機器 3.電材 4.設置工事」に固定。
# 「支給品」「材料費」等の独自大分類は作らない（支給品は明細の属性）。
# 機器（equipment）は設計確定情報＋単価マスターから動的に組み立てるため
# ここにはリストを持たない。単価はすべて「原価」。客出しは
# margin_rate（粗利率）を乗せて算出する（原価と客出しの分離＝6条）。
# 初期単価は鎌倉警察署 滑川交番様の原価表（2026-08-13）準拠の低圧標準値。
# =====================================================
estimate_format: "v2"   # "v1" にすると従来の6分類（支給品/材料費/施工費…）に戻る
margin_rate: 0.0        # 粗利率（0.10 = 原価+10%を客出し単価にする）

