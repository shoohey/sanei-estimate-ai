# =====================================================
# 太陽光発電設備 設置工事 価格ルール定義
# サンプル: ヤマダデンキ テックランド掛川店（190.08kW）
# =====================================================
# 注意: このファイルを編集することで単価を更新できます
# コード変更は不要です
# =====================================================
#
# ■ quantity_formula（計算式）について
# 数量を現調データから動的に計算できます。
# 使える変数:
#   - pv_capacity_kw        : PV容量(kW)
#   - planned_panels        : 設置予定枚数
#   - module_output_w       : モジュール定格出力(W)
#   - separation_ns_mm      : 離隔 縦(南北) mm
#   - separation_ew_mm      : 離隔 横(東西) mm
#   - separation_ns_m       : 離隔 縦 m
#   - separation_ew_m       : 離隔 横 m
#   - separation_total_m    : (ns + ew) / 1000
# 使える関数: max, min, abs, round, int, float, ceil, floor
# 使える演算子: + - * / // % **
# 例: "max(30, (separation_ns_mm + separation_ew_mm) / 1000 * 1.2)"
#
# ■ condition（条件式）について
# サポート: == != > >= < <= / AND OR NOT / 括弧
# 例: "equipment.pv_capacity_kw > 100 AND supplementary.cubicle_location == true"
#
# ■ 丸め・税額
# discount_method        : round_down_10000 / round_down_100000 / none
# tax_rounding_method    : floor / round / ceil
# =====================================================

# 消費税率
tax_rate: 0.10

# 値引き方式: round_down_10000 = 税抜合計を万円単位に切り捨て
discount_method: round_down_10000

# 税額の端数処理方式: floor / round / ceil
tax_rounding_method: floor

